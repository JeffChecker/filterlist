name: FRITZ!Box Filterliste aktualisieren

on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * *"
  push:
    paths:
      - ".github/workflows/update-filterlist.yml"
      - "scripts/aktualisieren.py"
      - "custom-domains.txt"
      - "ausnahmen.txt"

permissions:
  contents: write

jobs:
  aktualisieren:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Repository laden
        uses: actions/checkout@v4
      - name: Filterlisten abrufen, bereinigen und zusammenfuehren
        run: python3 scripts/aktualisieren.py
      - name: Nur bei Aenderungen hochladen
        run: |
          DATEI="Streaming_Werbeblocker_Amazon_Disney_YouTube.txt"
          if git diff --quiet -- "$DATEI"; then
            echo "Keine geaenderte Domainliste."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$DATEI"
          git commit -m "Filterliste: taeglicher Abgleich HaGeZi Light und OISD Small"
          git push
